name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-latest
          - name: Windows arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch libjxl sources
        shell: bash
        run: scripts/fetch-libjxl.sh

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Put CMake on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $bin = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
            if (-not (Test-Path (Join-Path $bin "cmake.exe"))) { throw "CMake was not found" }
            Add-Content $env:GITHUB_PATH $bin
          }

      - uses: Swatinem/rust-cache@v2

      - name: Format and license notices
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          python3 scripts/third_party_licenses.py --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Idle CPU check (macOS)
        if: runner.os == 'macOS'
        run: scripts/idle-check.sh target/release/optimize-image-folder 30

      - name: Idle CPU check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/idle-check.ps1 -Exe target/release/optimize-image-folder.exe -Seconds 30
