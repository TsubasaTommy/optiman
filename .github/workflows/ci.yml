name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  # Line tables keep backtraces readable with much less debug info to compile and link.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # libjxl is built once per target into this directory and cached separately (see build.rs).
  OPTIMAN_LIBJXL_CACHE_DIR: ${{ github.workspace }}/.libjxl-cache

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            clippy: true
          - name: Windows x64
            runner: windows-latest
            clippy: true
          # Same Windows code as x64; clippy there is enough.
          - name: Windows arm64
            runner: windows-11-arm
            clippy: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch libjxl sources
        id: libjxl
        shell: bash
        run: |
          scripts/fetch-libjxl.sh
          echo "sha=$(git rev-parse HEAD:third_party/libjxl)" >> "$GITHUB_OUTPUT"

      - name: Cache the libjxl build
        uses: actions/cache@v6
        with:
          path: .libjxl-cache
          key: libjxl-${{ runner.os }}-${{ runner.arch }}-${{ steps.libjxl.outputs.sha }}-${{ hashFiles('build.rs') }}

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Put CMake on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $bin = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
            if (-not (Test-Path (Join-Path $bin "cmake.exe"))) { throw "CMake was not found" }
            Add-Content $env:GITHUB_PATH $bin
          }

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format and license notices
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          python3 scripts/third_party_licenses.py --check

      - name: Clippy
        if: matrix.clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The test build's binaries are enough to measure idling; the release workflow builds
      # the optimized (LTO) binaries.
      - name: Idle CPU check (macOS)
        if: runner.os == 'macOS'
        run: scripts/idle-check.sh target/debug/optiman 30

      - name: Idle CPU check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/idle-check.ps1 -Exe target/debug/optiman.exe -Seconds 30

      - name: Install / uninstall smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "optiman-smoke"
          $photos = Join-Path $work "photos"
          New-Item -ItemType Directory -Force $photos | Out-Null
          $env:OPTIMAN_HOME = Join-Path $work "home"
          $cli = Resolve-Path target/debug/optiman.exe
          & $cli install --yes --new-only --folder $photos
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Get-ItemProperty $run -Name "optiman" -ErrorAction SilentlyContinue)) { throw "not registered" }
          Start-Sleep -Seconds 3
          if (-not (Get-Process "optiman-agent" -ErrorAction SilentlyContinue)) { throw "the agent did not start" }
          & $cli status
          & $cli uninstall --purge
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          Start-Sleep -Seconds 2
          if (Get-ItemProperty $run -Name "optiman" -ErrorAction SilentlyContinue) { throw "still registered" }
          if (Get-Process "optiman-agent" -ErrorAction SilentlyContinue) { throw "the agent is still running" }
          "OK: install, agent start, uninstall"
