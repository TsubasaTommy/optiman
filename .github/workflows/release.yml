name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and tests everything (including the upgrade from v0.2.0) without publishing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
  OPTIMAN_LIBJXL_CACHE_DIR: ${{ github.workspace }}/.libjxl-cache

jobs:
  macos:
    name: build (macOS universal)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Fetch libjxl sources
        id: libjxl
        run: |
          scripts/fetch-libjxl.sh
          echo "sha=$(git rev-parse HEAD:third_party/libjxl)" >> "$GITHUB_OUTPUT"

      - name: Cache the libjxl build
        uses: actions/cache@v6
        with:
          path: .libjxl-cache
          key: libjxl-release-macos-${{ steps.libjxl.outputs.sha }}-${{ hashFiles('build.rs') }}

      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # One cargo invocation builds both architectures in parallel.
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin --bin optiman

      - name: Universal binary
        run: |
          mkdir -p dist/pkg
          lipo -create -output dist/pkg/optiman \
            target/aarch64-apple-darwin/release/optiman \
            target/x86_64-apple-darwin/release/optiman
          lipo -info dist/pkg/optiman
          dist/pkg/optiman --version

      - name: Sign (Developer ID if configured, ad-hoc otherwise)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          BIN=dist/pkg/optiman
          if [ -n "$APPLE_CERT_P12" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
            if [ -n "$APPLE_ID" ]; then
              ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            fi
          else
            codesign --force --sign - "$BIN"
          fi
          codesign --verify --verbose "$BIN"

      - name: Package
        run: |
          cp README.md LICENSE THIRD_PARTY_LICENSES.txt dist/pkg/
          tar -C dist/pkg -czf dist/optiman-macos-universal.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.tar.gz

  windows:
    name: build (Windows ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch libjxl sources
        id: libjxl
        shell: bash
        run: |
          scripts/fetch-libjxl.sh
          echo "sha=$(git rev-parse HEAD:third_party/libjxl)" >> "$GITHUB_OUTPUT"

      - name: Cache the libjxl build
        uses: actions/cache@v6
        with:
          path: .libjxl-cache
          key: libjxl-release-${{ matrix.target }}-${{ steps.libjxl.outputs.sha }}-${{ hashFiles('build.rs') }}

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}

      - name: Put CMake on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $bin = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
            if (-not (Test-Path (Join-Path $bin "cmake.exe"))) { throw "CMake was not found" }
            Add-Content $env:GITHUB_PATH $bin
          }

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $out = "target/${{ matrix.target }}/release"
          $bin = "dist/windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $bin, dist/pkg | Out-Null
          Copy-Item "$out/optiman.exe", "$out/optiman-agent.exe" $bin
          Copy-Item "$bin/*", README.md, LICENSE, THIRD_PARTY_LICENSES.txt dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/optiman-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-bin
          path: dist/windows-${{ matrix.arch }}

  installer:
    name: installer (Inno Setup)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-bin
          path: dist/windows-x64

      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-bin
          path: dist/windows-arm64

      - name: Install Inno Setup (pinned hash and Authenticode signature)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup hash mismatch: $hash" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Inno Setup signature is not valid: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Start-Process -Wait -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`""
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe was not installed" }
          Add-Content $env:GITHUB_PATH $dir

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          ISCC.exe "/DAppVersion=$version" "/DBinX64=$PWD\dist\windows-x64" "/DBinArm64=$PWD\dist\windows-arm64" "/DOutputDir=$PWD\dist" packaging\windows\Optiman.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\Optiman-Setup.exe

      - name: Upgrade from v0.2.0 (published as Optimize Image Folder)
        timeout-minutes: 20
        shell: pwsh
        run: |
          function Invoke-Setup($exe, $log) {
            # Wait for setup itself only: `Start-Process -Wait` would also wait for the agent it starts.
            $p = Start-Process -PassThru -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=`"$log`""
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { throw "setup did not finish" }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "$exe exited with $($p.ExitCode)" }
          }
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $oldDir = Join-Path $env:LOCALAPPDATA "Programs\OptimizeImageFolder"
          $newDir = Join-Path $env:LOCALAPPDATA "Programs\Optiman"
          $old = Join-Path $env:RUNNER_TEMP "OptimizeImageFolder-Setup.exe"
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v0.2.0/OptimizeImageFolder-Setup.exe" -OutFile $old
          Invoke-Setup $old (Join-Path $env:RUNNER_TEMP "old.log")
          Start-Sleep -Seconds 3
          if (-not (Get-Process "optimize-image-folder-agent" -ErrorAction SilentlyContinue)) { throw "the v0.2.0 agent is not running" }

          $log = Join-Path $env:RUNNER_TEMP "upgrade.log"
          Invoke-Setup dist\Optiman-Setup.exe $log
          Start-Sleep -Seconds 3
          $failures = @()
          if (Test-Path $oldDir) { Get-ChildItem $oldDir; $failures += "the old program folder remains" }
          if (-not (Test-Path "$newDir\optiman.exe")) { $failures += "optiman.exe is missing" }
          if (Get-ItemProperty $runKey -Name "optimize-image-folder" -ErrorAction SilentlyContinue) { $failures += "the old autostart entry remains" }
          if (-not (Get-ItemProperty $runKey -Name "optiman" -ErrorAction SilentlyContinue)) { $failures += "the new autostart entry is missing" }
          if (Get-Process "optimize-image-folder-agent" -ErrorAction SilentlyContinue) { $failures += "the old agent is still running" }
          if (-not (Get-Process "optiman-agent" -ErrorAction SilentlyContinue)) { $failures += "the new agent is not running" }
          if (Test-Path (Join-Path $env:APPDATA "optimize-image-folder")) { $failures += "the old settings folder remains" }
          if (-not (Test-Path (Join-Path $env:APPDATA "optiman\config.toml"))) { $failures += "the settings were not moved" }
          if ((Get-ItemProperty "HKCU:\Environment").Path -match "OptimizeImageFolder") { $failures += "the old PATH entry remains" }
          if (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Optimize Image Folder.lnk")) { $failures += "the old shortcut remains" }
          if ($failures) { Get-Content $log -Tail 40; throw ($failures -join "; ") }
          & "$newDir\optiman.exe" status
          "OK: upgrade from v0.2.0"

          # Start the fresh-install test below from a clean profile.
          $u = Start-Process -Wait -PassThru -FilePath "$newDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA "optiman"), (Join-Path $env:LOCALAPPDATA "optiman") -ErrorAction SilentlyContinue

      - name: Silent install, run and uninstall
        timeout-minutes: 20
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          # Wait for setup itself only: `Start-Process -Wait` would also wait for the agent it starts.
          $p = Start-Process -PassThru -FilePath dist\Optiman-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=`"$log`""
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { throw "setup did not finish" }
          Get-Content $log -Tail 30
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Optiman"
          foreach ($f in "optiman.exe", "optiman-agent.exe", "THIRD_PARTY_LICENSES.txt") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing $f" }
          }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "optiman" -ErrorAction SilentlyContinue
          if (-not $run) {
            & "$app\optiman.exe" install --yes --new-only  # shows why registration failed
            throw "autostart entry was not registered"
          }
          Start-Sleep -Seconds 3
          $agent = Get-Process "optiman-agent" -ErrorAction SilentlyContinue
          if (-not $agent) { throw "the agent is not running" }
          "agent: threads $($agent.Threads.Count), private $([math]::Round($agent.PrivateMemorySize64 / 1MB, 1)) MB"
          & "$app\optiman.exe" status

          $u = Start-Process -Wait -PassThru -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "optiman" -ErrorAction SilentlyContinue) {
            throw "autostart entry was not removed"
          }
          if (Get-Process "optiman-agent" -ErrorAction SilentlyContinue) { throw "the agent is still running" }
          "OK: install, autostart, agent start, uninstall"

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/Optiman-Setup.exe

  publish:
    name: publish release
    needs: [macos, windows, installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum *.tar.gz *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
