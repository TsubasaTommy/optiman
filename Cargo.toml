[package]
name = "optimize-image-folder"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Resident photo-folder watcher that converts photos to AV1 (AVIF) with zero idle CPU, using native OS APIs"
repository = "https://github.com/TsubasaTommy/optimize-image-folder"
readme = "README.md"
default-run = "optimize-image-folder"

[features]
default = ["asm"]
# SIMD assembly for rav1e (needs nasm on x86_64)
asm = ["rav1e/asm"]

[lib]
name = "oif"
path = "src/lib.rs"

[[bin]]
name = "optimize-image-folder"
path = "src/main.rs"

[[bin]]
name = "optimize-image-folder-agent"
path = "src/bin/agent.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
avif-parse = "2"
avif-serialize = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
rav1e = { version = "0.8.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tempfile = "3.27.0"
