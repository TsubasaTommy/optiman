<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="title">
<title id="title">写真はそのまま。容量だけ、小さく。ピクチャフォルダの IMG_2041.jpg (2.29 MB) が IMG_2041.jxl (1.85 MB) に、夕景_4K.png (10.3 MB) が夕景_4K.jxl (5.76 MB) に変換され、IMG_2042.heic はそのまま残る様子</title>
<style>
  .card { fill: #767675; }
  .head { fill: #ffffff; font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif CJK JP", serif; font-weight: 600; font-size: 58px; letter-spacing: .04em; font-feature-settings: "palt"; }
  text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .caption { fill: #ffffff; font-size: 13px; }
  .win { fill: #ffffff; }
  .chrome { fill: #f4f5f3; }
  .rule, .dot { fill: #e6e7e4; }
  .title { fill: #1f2021; font-size: 13px; font-weight: 700; }
  .col { fill: #5c5e60; font-size: 12px; }
  .name { fill: #1f2021; font-size: 16px; font-weight: 700; }
  .size { fill: #1f2021; font-size: 15px; }
  .muted, .notetext, .status { fill: #5c5e60; }
  .notetext { font-size: 13px; }
  .status { font-size: 12px; }
  .stroke { stroke: #5c5e60; }
  .mutedfill { fill: #5c5e60; }
  .okstroke { stroke: #2f7a3a; }
  .track { fill: #e3e4e1; }
  .bar { fill: #3b3d3f; transform-box: fill-box; transform-origin: 0 50%; }
  /* Without animation every element shows the converted result. */
  .out { opacity: 0; animation: out .01s linear both; }
  .in { animation: in .01s linear both; }
  .note { animation: in .35s ease-out both; }
  .st-detect { opacity: 0; animation: out .01s linear .8s both; }
  .st-work { opacity: 0; animation: work 4.4s linear both; }
  .st-idle { animation: in .01s linear 4.4s both; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes work { 0%, 18.18% { opacity: 0; } 18.19%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes shrink0 { from { transform: scaleX(1); } to { transform: scaleX(0.81); } }
  @keyframes shrink1 { from { transform: scaleX(1); } to { transform: scaleX(0.56); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/></filter>
  <clipPath id="round"><rect width="464" height="390" rx="10"/></clipPath>
</defs>
<rect width="1100" height="480" rx="12" class="card"/>
<text x="56" y="222" class="head">写真はそのまま。</text>
<text x="56" y="302" class="head">容量だけ、小さく。</text>
<g transform="translate(592 40)">
  <rect width="464" height="390" rx="10" class="win" filter="url(#shadow)"/>
  <g clip-path="url(#round)">
    <rect width="464" height="40" class="chrome"/>
    <rect y="40" width="464" height="1" class="rule"/>
    <circle cx="20" cy="20" r="5" class="dot"/><circle cx="36" cy="20" r="5" class="dot"/><circle cx="52" cy="20" r="5" class="dot"/>
    <text x="70" y="25" class="title">ピクチャ</text>
    <text x="52" y="60" class="col">名前</text>
    <text x="448" y="60" class="col" text-anchor="end">サイズ</text>
    <rect y="70" width="464" height="1" class="rule"/>
    <g transform="translate(0 70)">
    <g transform="translate(16 14)"><path d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="none" stroke-width="1.4" class="stroke"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill"/></g>
    <text x="52" y="30" class="name out" style="animation-delay:1.8s">IMG_2041.jpg</text>
    <text x="52" y="30" class="name in" style="animation-delay:1.8s">IMG_2041.jxl</text>
    <text x="448" y="30" class="size out" text-anchor="end" style="animation-delay:1.8s">2.29 MB</text>
    <text x="448" y="30" class="size in" text-anchor="end" style="animation-delay:1.8s">1.85 MB<tspan class="muted" dx="6">−19%</tspan></text>
    <rect x="52" y="42" width="396" height="6" rx="3" class="track"/>
    <rect x="52" y="42" width="396" height="6" rx="3" class="bar" style="transform: scaleX(0.81); animation: shrink0 1s cubic-bezier(.2,.7,.2,1) 0.8s both"/>
    <g class="note" style="animation-delay:1.8s"><g transform="translate(52 59)"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="okstroke"/></g><text x="72" y="70" class="notetext">元の JPEG にバイト単位で戻せることを確認</text></g>
    <rect x="0" y="95" width="464" height="1" class="rule"/>
    </g>
    <g transform="translate(0 166)">
    <g transform="translate(16 14)"><path d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="none" stroke-width="1.4" class="stroke"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill"/></g>
    <text x="52" y="30" class="name out" style="animation-delay:3.1s">夕景_4K.png</text>
    <text x="52" y="30" class="name in" style="animation-delay:3.1s">夕景_4K.jxl</text>
    <text x="448" y="30" class="size out" text-anchor="end" style="animation-delay:3.1s">10.3 MB</text>
    <text x="448" y="30" class="size in" text-anchor="end" style="animation-delay:3.1s">5.76 MB<tspan class="muted" dx="6">−44%</tspan></text>
    <rect x="52" y="42" width="396" height="6" rx="3" class="track"/>
    <rect x="52" y="42" width="396" height="6" rx="3" class="bar" style="transform: scaleX(0.56); animation: shrink1 1s cubic-bezier(.2,.7,.2,1) 2.1s both"/>
    <g class="note" style="animation-delay:3.1s"><g transform="translate(52 59)"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="okstroke"/></g><text x="72" y="70" class="notetext">すべての画素が元と一致することを確認</text></g>
    <rect x="0" y="95" width="464" height="1" class="rule"/>
    </g>
    <g transform="translate(0 262)">
    <g transform="translate(16 14)"><path d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="none" stroke-width="1.4" class="stroke"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill"/></g>
    <text x="52" y="30" class="name">IMG_2042.heic</text>
    <text x="448" y="30" class="size" text-anchor="end">3.08 MB</text>
    <rect x="52" y="42" width="396" height="6" rx="3" class="track"/>
    <rect x="52" y="42" width="396" height="6" rx="3" class="bar"/>
    <g class="note" style="animation-delay:4.4s"><g transform="translate(52 59)"><path d="M3 7h8" fill="none" stroke-width="1.8" stroke-linecap="round" class="stroke"/></g><text x="72" y="70" class="notetext">劣化なしでは変換できない形式なので、元のまま</text></g>
    </g>
    <rect y="358" width="464" height="32" class="chrome"/>
    <text x="16" y="379" class="status">3 項目</text>
    <text x="448" y="379" class="status st-detect" text-anchor="end">新しい写真を検出</text>
    <text x="448" y="379" class="status st-work" text-anchor="end">変換中 (低優先度)</text>
    <text x="448" y="379" class="status st-idle" text-anchor="end">待機中、CPU 使用率 0%</text>
  </g>
</g>
<text x="592" y="460" class="caption">JPEG と PNG のサイズは 4K 写真での実測値 (圧縮の強さ 7)</text>
</svg>
