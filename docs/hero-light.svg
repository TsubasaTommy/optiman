<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" aria-labelledby="title" role="img" viewBox="0 0 1100 480"><title id="title">写真はそのまま。容量だけ、小さく。ピクチャフォルダの IMG_2041.jpg (5.6 MB) が IMG_2041.jxl (4.4 MB) に、夕景_4K.png (10.6 MB) が夕景_4K.jxl (6.2 MB) に変換され、IMG_2042.heic はそのまま残る様子</title><style>@keyframes work{0%,18.18%{opacity:0}18.19%,99.9%{opacity:1}}.card{fill:#767675}.head{fill:#fff;font-family:&quot;Hiragino Mincho ProN&quot;,&quot;Hiragino Mincho Pro&quot;,&quot;Yu Mincho&quot;,YuMincho,&quot;Noto Serif JP&quot;,&quot;Noto Serif CJK JP&quot;,serif;font-weight:600;font-size:58px;letter-spacing:.04em;font-feature-settings:&quot;palt&quot;}text{font-family:&quot;Hiragino Sans&quot;,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic UI&quot;,&quot;Yu Gothic&quot;,Meiryo,system-ui,sans-serif;font-variant-numeric:tabular-nums}.caption{font-size:13px}.caption,.win{fill:#fff}.chrome{fill:#f4f5f3}.dot,.rule{fill:#e6e7e4}.title{fill:#1f2021;font-size:13px;font-weight:700}.col{fill:#5c5e60;font-size:12px}.name{fill:#1f2021;font-size:16px;font-weight:700}.size{fill:#1f2021;font-size:15px}.muted,.notetext,.status{fill:#5c5e60}.notetext{font-size:13px}.status{font-size:12px}.stroke{stroke:#5c5e60}.mutedfill{fill:#5c5e60}.okstroke{stroke:#2f7a3a}.track{fill:#e3e4e1}.bar{fill:#3b3d3f;transform-box:fill-box;transform-origin:0 50%}.out{opacity:0;animation:out .01s linear both}.in{animation:in .01s linear both}.note{animation:in .35s ease-out both}.st-detect,.st-work{opacity:0;animation:out .01s linear .8s both}.st-work{animation:work 4.4s linear both}.st-idle{animation:in .01s linear 4.4s both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="shadow" width="140%" height="150%" x="-20%" y="-20%"><feDropShadow dx="0" dy="20" flood-color="#000" flood-opacity=".35" stdDeviation="18"/></filter><clipPath id="round"><rect width="464" height="390" rx="10"/></clipPath></defs><rect width="1100" height="480" class="card" rx="12"/><text x="56" y="222" class="head">写真はそのまま。</text><text x="56" y="302" class="head">容量だけ、小さく。</text><g transform="translate(592 40)"><rect width="464" height="390" class="win" filter="url(#shadow)" rx="10"/><g clip-path="url(#round)"><rect width="464" height="40" class="chrome"/><rect width="464" height="1" y="40" class="rule"/><circle cx="20" cy="20" r="5" class="dot"/><circle cx="36" cy="20" r="5" class="dot"/><circle cx="52" cy="20" r="5" class="dot"/><text x="70" y="25" class="title">ピクチャ</text><text x="52" y="60" class="col">名前</text><text x="448" y="60" class="col" text-anchor="end">サイズ</text><rect width="464" height="1" y="70" class="rule"/><g transform="translate(0 70)"><g><path fill="none" stroke-width="1.4" d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" class="stroke" transform="translate(16 14)"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill" transform="translate(16 14)"/></g><text x="52" y="30" class="name out" style="animation-delay:1.8s">IMG_2041.jpg</text><text x="52" y="30" class="name in" style="animation-delay:1.8s">IMG_2041.jxl</text><text x="448" y="30" class="size out" text-anchor="end" style="animation-delay:1.8s">5.6 MB</text><text x="448" y="30" class="size in" text-anchor="end" style="animation-delay:1.8s">4.4 MB<tspan class="muted" dx="6">−21%</tspan></text><rect width="396" height="6" x="52" y="42" class="track" rx="3"/><rect width="396" height="6" x="52" y="42" class="bar" rx="3" style="transform:scaleX(.79);animation:shrink0 1s cubic-bezier(.2,.7,.2,1) .8s both"/><g class="note" style="animation-delay:1.8s"><g><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.5 7.5l3 3 6-7" class="okstroke" transform="translate(52 59)"/></g><text x="72" y="70" class="notetext">元の JPEG にバイト単位で戻せることを確認</text></g><rect width="464" height="1" x="0" y="95" class="rule"/></g><g transform="translate(0 166)"><g><path fill="none" stroke-width="1.4" d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" class="stroke" transform="translate(16 14)"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill" transform="translate(16 14)"/></g><text x="52" y="30" class="name out" style="animation-delay:3.1s">夕景_4K.png</text><text x="52" y="30" class="name in" style="animation-delay:3.1s">夕景_4K.jxl</text><text x="448" y="30" class="size out" text-anchor="end" style="animation-delay:3.1s">10.6 MB</text><text x="448" y="30" class="size in" text-anchor="end" style="animation-delay:3.1s">6.2 MB<tspan class="muted" dx="6">−41%</tspan></text><rect width="396" height="6" x="52" y="42" class="track" rx="3"/><rect width="396" height="6" x="52" y="42" class="bar" rx="3" style="transform:scaleX(.59);animation:shrink1 1s cubic-bezier(.2,.7,.2,1) 2.1s both"/><g class="note" style="animation-delay:3.1s"><g><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.5 7.5l3 3 6-7" class="okstroke" transform="translate(52 59)"/></g><text x="72" y="70" class="notetext">すべての画素が元と一致することを確認</text></g><rect width="464" height="1" x="0" y="95" class="rule"/></g><g transform="translate(0 262)"><g><path fill="none" stroke-width="1.4" d="M3 1h12l6 6v21a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" class="stroke" transform="translate(16 14)"/><path d="M6 23l4.5-5.5 3 3.5 2-2 3 4z" class="mutedfill" transform="translate(16 14)"/></g><text x="52" y="30" class="name">IMG_2042.heic</text><text x="448" y="30" class="size" text-anchor="end">3.08 MB</text><rect width="396" height="6" x="52" y="42" class="track" rx="3"/><rect width="396" height="6" x="52" y="42" class="bar" rx="3"/><g class="note" style="animation-delay:4.4s"><g><path fill="none" stroke-linecap="round" stroke-width="1.8" d="M3 7h8" class="stroke" transform="translate(52 59)"/></g><text x="72" y="70" class="notetext">劣化なしでは変換できない形式なので、元のまま</text></g></g><rect width="464" height="32" y="358" class="chrome"/><text x="16" y="379" class="status">3 項目</text><text x="448" y="379" class="status st-detect" text-anchor="end">新しい写真を検出</text><text x="448" y="379" class="status st-work" text-anchor="end">変換中 (低優先度)</text><text x="448" y="379" class="status st-idle" text-anchor="end">待機中、CPU 使用率 0%</text></g></g><text x="592" y="460" class="caption">JPEG と PNG のサイズは、下の表の写真で測った実測値</text></svg>